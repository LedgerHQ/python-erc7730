name: ✨ release

# RC: `gh release create vX.Y.Z-rcN --prerelease --target <branch>` publishes the image only, not the wheel
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: publish artifacts
    if: ${{ !github.event.release.prerelease }}
    timeout-minutes: 60
    runs-on: public-ledgerhq-shared-small
    steps:
      - name: Login to Ledger Artifactory
        timeout-minutes: 10
        id: jfrog-login
        uses: LedgerHQ/actions-security/actions/jfrog-login@actions/jfrog-login-1

      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup mise
        timeout-minutes: 10
        uses: jdx/mise-action@v5.2.7

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          pdm install --dev --check --frozen-lockfile
          pdm install --plugins

      - name: Build library artifacts
        timeout-minutes: 10
        run: pdm build

      - name: Publish library artifacts to public PyPI via Ledger Artifactory
        timeout-minutes: 10
        env:
          PDM_PUBLISH_REPO: https://jfrog.ledgerlabs.net/artifactory/api/pypi/vault-pypi-prod-public
          PDM_PUBLISH_USERNAME: ${{ steps.jfrog-login.outputs.oidc-user }}
          PDM_PUBLISH_PASSWORD: ${{ steps.jfrog-login.outputs.oidc-token }}
        run: pdm publish --no-build

      - name: Generate library build attestations
        timeout-minutes: 10
        uses: LedgerHQ/actions-security/actions/attest@actions/attest-1
        with:
          subject-path: dist/*

      - name: Sign library artifacts
        timeout-minutes: 10
        uses: LedgerHQ/actions-security/actions/sign-blob@actions/sign-blob-1
        with:
          path: dist

  image:
    name: publish image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@v7

      - name: Setup mise
        timeout-minutes: 10
        uses: jdx/mise-action@v5.2.7

      - name: Get versions
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "version=${TAG#v}"
            echo "pdm=$(mise current pdm)"
            echo "python=$(mise current python)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        timeout-minutes: 10
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup buildx
        timeout-minutes: 10
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            PDM_VERSION=${{ steps.version.outputs.pdm }}
            PYTHON_VERSION=${{ steps.version.outputs.python }}
          tags: ghcr.io/ledgerhq/python-erc7730:${{ steps.version.outputs.version }}
          push: true
